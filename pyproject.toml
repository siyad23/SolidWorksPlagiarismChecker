[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sw_plagiarism_checker"
version = "0.1.0"
authors = [
    { name = "siyad23" },
]
description = "Detect plagiarism in SolidWorks .SLDPRT and .SLDASM assignment files. CLI + Web App."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "olefile>=0.47",
    "fpdf2>=2.7",
    "tqdm>=4.60",
    "colorama>=0.4",
]

[project.optional-dependencies]
drive = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
]
web = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "python-multipart>=0.0.5",
    "jinja2>=3.1",
]
all = [
    "sw_plagiarism_checker[drive,web]",
    "pywin32>=306",
]

[project.scripts]
sw-plagiarism-checker = "cli.main:main"

[project.urls]
"Homepage" = "https://github.com/siyad23/SolidWorksPlagiarismChecker"
"Bug Tracker" = "https://github.com/siyad23/SolidWorksPlagiarismChecker/issues"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sw_plagiarism_checker*", "cli*", "web*"]
