[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sw_plagiarism_checker"
version = "0.1.0"
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
description = "A core algorithm for detecting plagiarism in SolidWorks .SLDPRT files."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "olefile>=0.47"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/sw_plagiarism_checker"
"Bug Tracker" = "https://github.com/yourusername/sw_plagiarism_checker/issues"
